[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-runtime"
version = "0.1.0"
description = "An educational asyncio inference runtime with simulated and optional local execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]
local = ["torch>=2.6,<3", "transformers>=4.57.1,<4.58"]
browser = ["playwright>=1.56,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_runtime = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
